<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Test</title>
<style>
  body {
    font-family: Arial;
    background: #f1f5f9;
    padding: 30px;
    text-align: center;
  }
  .box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 4px 15px #ddd;
  }
  input {
    padding: 12px;
    width: 90%;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  button {
    padding: 12px 25px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    text-align: left;
  }
</style>
</head>
<body>
<div class="box">
<h1>🔥 Firebase Test</h1>
<input
  type="text"
  id="name"
  placeholder="Enter your name"
>
<br>
<button id="saveBtn">Save Data</button>
<h3>Saved Data</h3>
<div id="result">Loading...</div>
</div>
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
// FIREBASE CONFIGURATION
const firebaseConfig = {
  apiKey: "AIzaSyA8hqAB7kriqwf51YD-sfS-h7OelyHw1e4",
  authDomain: "test-web-3b2bc.firebaseapp.com",
  projectId: "test-web-3b2bc",
  storageBucket: "test-web-3b2bc.firebasestorage.app",
  messagingSenderId: "899496262973",
  appId: "1:899496262973:web:2e25d4f53db7b5a7331954",
  measurementId: "G-9J8E3MD21K"
};
// CONNECT FIREBASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// SAVE DATA
document.getElementById("saveBtn").addEventListener("click", saveData);
async function saveData() {
  const name = document.getElementById("name").value.trim();
  if (!name) {
    alert("Please enter your name!");
    return;
  }
  try {
    await addDoc(collection(db, "users"), {
      name: name,
      createdAt: new Date().toISOString()
    });
    alert("Data Saved Successfully!");
    document.getElementById("name").value = "";
    loadData();
  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  }
}
// LOAD DATA
async function loadData() {
  try {
    const snapshot = await getDocs(collection(db, "users"));
    const result = document.getElementById("result");
    result.innerHTML = "";
    snapshot.forEach((doc) => {
      const p = document.createElement("p");
      p.textContent = "👤 " + doc.data().name;
      result.appendChild(p);
    });
    if (snapshot.empty) {
      result.textContent = "No data found.";
    }
  } catch (error) {
    console.error(error);
    document.getElementById("result").textContent =
    "Error: " + error.message;
  }
}
// START
loadData();
</script>
</body>
</html>
